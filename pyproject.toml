[project]
name = "churn-inference-service"
version = "0.3.0"
description = "FastAPI inference service for a customer churn model"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # starlette's TestClient deprecation notice about httpx; not actionable here
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
